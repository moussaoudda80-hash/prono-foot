<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prono Foot</title>
<style>
:root{--bg:#121214;--card:#1c1c1f;--tx:#f2f2f4;--mut:#9a9aa3;--pri:#b52cf0;--pri2:#4a1a6b;--ok:#3ddc84;--line:#2c2c31;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f4f7;--card:#fff;--tx:#18181b;--mut:#6b6b75;--pri2:#e9c9fb;--line:#e1e1e6;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:env(safe-area-inset-top) 0 80px}
header{padding:14px 16px 4px}h1{margin:0;font-size:22px;font-weight:800}h1 b{color:var(--pri)}
#upd{color:var(--mut);font-size:12px;margin-top:2px}
.filters{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.conf{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}.conf input{flex:1;accent-color:var(--pri)}
.league{padding:14px 16px 2px;font-weight:700}.t{width:46px;font-size:13px;color:var(--mut)}
.m{margin:8px 12px;background:var(--card);border-radius:14px;padding:12px}
.row{display:flex;align-items:center;gap:10px}.teams{flex:1;font-size:16px;line-height:1.7}
.pick{min-width:104px;text-align:center;border-radius:10px;padding:6px 8px;background:repeating-linear-gradient(135deg,var(--pri2) 0 10px,transparent 10px 20px),var(--pri2);border:1px solid var(--pri)}
.pick b{display:block;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:3px}.pick span{font-size:13px;color:var(--mut)}.pick em{font-style:normal;color:var(--tx);font-weight:600}
.star{background:none;border:0;font-size:24px;color:var(--mut);padding:4px}.star.on{color:#ffc933}
.more{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);line-height:1.6}.m.open .more{display:block}
.bar{height:6px;border-radius:4px;background:var(--line);margin:6px 0}.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;max-width:560px;margin:auto}nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;font-size:12px}nav button.on{color:var(--pri)}nav span{display:block;font-size:20px}
</style></head><body>
<header><h1>Prono<b>Foot</b></h1><div id="upd">Chargement…</div></header>
<div class="filters"><div class="chips" id="chips2"></div><div class="chips" id="chips"></div>
<label class="conf">Confiance min. <input type="range" id="conf" min="0" max="90" step="5" value="0"><b id="cv" style="color:var(--tx)">0%</b></label></div>
<div id="list"></div>
<nav><div><button class="on" id="n1"><span>⚽</span>Matchs</button><button id="n2"><span>★</span>Favoris</button></div></nav>
<script>
var DATA=[],mkt="Tous",lg="Toutes",tab="m",favs={};
try{favs=JSON.parse(localStorage.getItem("pf_favs")||"{}")}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cf(m){return m.confidence==null?"—":m.confidence+"%"}
function key(m){return m.home+"-"+m.away}
function hour(m){if(!m.kickoff)return"";var d=new Date(m.kickoff);return isNaN(d)?"":d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function row(id,list,cur,set){var c=document.getElementById(id);c.innerHTML="";
 list.forEach(function(x){var b=document.createElement("button");b.className="chip"+(x==cur?" on":"");b.textContent=x;b.onclick=function(){set(x);draw()};c.appendChild(b)})}
function draw(){
 var ms=["Tous"],ls=["Toutes"];
 DATA.forEach(function(m){if(ms.indexOf(m.market)<0)ms.push(m.market);if(ls.indexOf(m.league)<0)ls.push(m.league)});
 row("chips2",ls,lg,function(x){lg=x});row("chips",ms,mkt,function(x){mkt=x});
 var min=+document.getElementById("conf").value;document.getElementById("cv").textContent=min+"%";
 var L=DATA.filter(function(m){return(tab=="m"||favs[key(m)])&&(mkt=="Tous"||m.market==mkt)&&(lg=="Toutes"||m.league==lg)&&m.confidence>=min});
 var o=L.length?"":'<div class="empty">'+(tab=="f"?"Aucun favori. Touche ☆ sur un match.":"Aucun prono pour ce filtre.")+'</div>',last="";
 L.forEach(function(m){var k=key(m);
  if(m.league!=last){o+='<div class="league">'+esc(m.league)+'</div>';last=m.league}
  o+='<div class="m"><div class="row"><div class="t">'+hour(m)+'</div><div class="teams">'+esc(m.home)+'<br>'+esc(m.away)+'</div>'+
  '<div class="pick"><b>'+esc(m.market).toUpperCase()+'</b><span>'+cf(m)+' ⚡ <em>'+(m.odds?m.odds.toFixed(2):"NA")+'</em></span></div>'+
  '<button class="star'+(favs[k]?" on":"")+'" data-s="'+esc(k)+'">'+(favs[k]?"★":"☆")+'</button></div>'+
  '<div class="more">Confiance moyenne : '+cf(m)+'<div class="bar"><i style="width:'+(m.confidence||0)+'%"></i></div>Accord entre sources : '+esc(m.agreement||"")+'<br>Sources : '+esc((m.sources||[]).join(", "))+'</div></div>'});
 document.getElementById("list").innerHTML=o}
document.getElementById("list").onclick=function(e){
 var s=e.target.closest("[data-s]");
 if(s){var k=s.getAttribute("data-s");if(favs[k])delete favs[k];else favs[k]=1;try{localStorage.setItem("pf_favs",JSON.stringify(favs))}catch(x){}draw();return}
 var m=e.target.closest(".m");if(m)m.classList.toggle("open")};
document.getElementById("conf").oninput=draw;
document.getElementById("n1").onclick=function(){tab="m";this.className="on";document.getElementById("n2").className="";draw()};
document.getElementById("n2").onclick=function(){tab="f";this.className="on";document.getElementById("n1").className="";draw()};
fetch("predictions.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
 DATA=d.matches||[];document.getElementById("upd").textContent="Pronos du "+d.date+" · "+DATA.length+" matchs";draw()})
.catch(function(){document.getElementById("upd").textContent="predictions.json introuvable";draw()});
</script></body></html>
